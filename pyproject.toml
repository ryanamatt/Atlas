[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-vault"            # see the name note below
version = "0.1.0"
description = "A command-line tool for managing and validating Markdown-based worldbuilding vaults."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"                 # SPDX expression; pick your own license
license-files = ["LICENSE"]
authors = [{ name = "Ryan Mattson", email = "ramattson5@gmail.com" }]
keywords = ["worldbuilding", "markdown", "cli", "vault"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ryanamatt/Atlas/tree/master"
Issues = "https://github.com/ryanamatt/Atlas/tree/master/issues"

[project.scripts]
atlas = "atlas.main:main"

[tool.setuptools.packages.find]
include = ["atlas*"]
